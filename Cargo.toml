[package]
name = "Blame_Serena"
version = "0.1.0"
edition = "2021"
authors = ["Randy Bailey"]

[dependencies]
tokio = { version = "1.44", features = ["full"] }
serenity = { version = "0.12", features = ["full"]}
poise = { git = "https://github.com/serenity-rs/poise.git", branch = "current", features = ["default"] }
toml = "0.8.19"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
postgres-types = { version = "0.2", features = ["with-serde_json-1"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
serde_json = "1.0.127"
reqwest = { version = "0.12.0", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-openai = "0.28"
serde = { version = "1.0.209", features = ["derive"] }
thiserror = "2.0.12"
futures-util = "0.3.30"
futures = "0.3.30"
rand = "0.9"
sysinfo = "0.33"
num-traits = "0.2.19"
bytes = "1.7.1"
regex = "1.10.2"
lazy_static = "1.5.0"
deadpool-postgres = "0.14.1"
tracing-appender = "0.2.3"
dotenv = "0.15.0"
dashmap = "5.4.0"
once_cell = "1.19.0"

# Web server dependencies
actix-web = "4.3"
actix-files = "0.6"
actix-cors = "0.6"
actix-web-lab = "0.19"
jsonwebtoken = "8.3"
oauth2 = "4.4"
urlencoding = "2.1"



[patch.crates-io.serenity]
git = "https://github.com/serenity-rs/serenity"
branch = "current"
