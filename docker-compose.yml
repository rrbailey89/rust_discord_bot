version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - saltbox  # Connect to the existing saltbox network
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      - "com.github.saltbox.saltbox_managed=true"
      
      # HTTP Router configuration - read domain from environment variable
      - "traefik.http.routers.discord-bot.rule=Host(`${TRAEFIK_DOMAIN:-blameserena.rayplex.life}`)"
      - "traefik.http.routers.discord-bot.entrypoints=websecure"
      
      # Service configuration - tells Traefik which port your app is running on
      - "traefik.http.services.discord-bot.loadbalancer.server.port=3000"
      
      # Enable TLS - Traefik will handle certificate acquisition automatically
      - "traefik.http.routers.discord-bot.tls=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

networks:
  saltbox:
    external: true  # Use the existing saltbox network
