version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - saltbox  # Connect to the existing saltbox network

networks:
  saltbox:
    external: true  # Use the existing saltbox network
